name: R-CMD-check

on:
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: |
          Rscript -e '
          # glinty and tts.api are not on CRAN, and both are public,
          # so no token is involved. Passing an expired PAT is what
          # turned an anonymous fetch into a 401.
          remotes::install_github(c("cornball-ai/glinty", "cornball-ai/tts.api"),
                                  dependencies = TRUE, upgrade = "never")
          remotes::install_deps(".", dependencies = TRUE, upgrade = "never")
          '

      - name: Test
        run: ./run.sh run_tests
